<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Blueprint blue background -->
  <rect width="64" height="64" rx="14" fill="#082d56"/>

  <!-- Tape measure body (yellow/gold) -->
  <rect x="5" y="13" width="34" height="38" rx="8" fill="#f5c41a"/>
  <rect x="5" y="13" width="34" height="38" rx="8" fill="none" stroke="#c69800" stroke-width="1.5"/>

  <!-- Calculator display screen -->
  <rect x="9" y="18" width="22" height="9" rx="2.5" fill="#082d56"/>
  <line x1="12" y1="22.5" x2="28" y2="22.5" stroke="#4db0ff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="25.5" x2="22" y2="25.5" stroke="#4db0ff" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

  <!-- Keypad buttons (3 x 2 grid) -->
  <rect x="9"  y="30" width="6" height="5" rx="1.5" fill="#c69800" opacity="0.8"/>
  <rect x="17" y="30" width="6" height="5" rx="1.5" fill="#c69800" opacity="0.8"/>
  <rect x="25" y="30" width="6" height="5" rx="1.5" fill="#c69800" opacity="0.8"/>
  <rect x="9"  y="37" width="6" height="5" rx="1.5" fill="#c69800" opacity="0.8"/>
  <rect x="17" y="37" width="6" height="5" rx="1.5" fill="#c69800" opacity="0.8"/>
  <rect x="25" y="37" width="6" height="5" rx="1.5" fill="#c69800" opacity="0.8"/>

  <!-- Extended tape -->
  <rect x="39" y="25" width="20" height="14" rx="2" fill="#fef6c0"/>
  <rect x="39" y="25" width="20" height="14" rx="2" fill="none" stroke="#d4ba40" stroke-width="0.5"/>

  <!-- Tape measure tick marks -->
  <line x1="43" y1="25" x2="43" y2="28"   stroke="#b08818" stroke-width="1"/>
  <line x1="47" y1="25" x2="47" y2="30.5" stroke="#b08818" stroke-width="1.2"/>
  <line x1="51" y1="25" x2="51" y2="28"   stroke="#b08818" stroke-width="1"/>
  <line x1="55" y1="25" x2="55" y2="28"   stroke="#b08818" stroke-width="1"/>

  <!-- End hook -->
  <path d="M59 25 L59 39 L57 39" stroke="#aaaaaa" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
