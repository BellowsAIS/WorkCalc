name: Build TWA (Android AAB)

# Triggered manually from the Actions tab.
# Enter the version code and name, then download the signed AAB from the run artifacts.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'appVersionCode — must be higher than the last Play Store upload'
        required: true
        type: string
      version_name:
        description: 'appVersionName (e.g. 1.0.014)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: |
          npm install -g @bubblewrap/cli
          GLOBAL_ROOT=$(npm root -g)
          # Expose both the top-level global root and the CLI's own node_modules
          # so Node's require() can find @bubblewrap/core in either location.
          echo "NODE_PATH=${GLOBAL_ROOT}:${GLOBAL_ROOT}/@bubblewrap/cli/node_modules" >> $GITHUB_ENV

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > twa/android.keystore

      - name: Update version fields in twa-manifest.json
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa/twa-manifest.json', 'utf8'));
            m.appVersionCode = parseInt('${{ github.event.inputs.version_code }}');
            m.appVersionName = '${{ github.event.inputs.version_name }}';
            fs.writeFileSync('twa/twa-manifest.json', JSON.stringify(m, null, 2) + '\n');
            console.log('Version code:', m.appVersionCode, '/ name:', m.appVersionName);
          "

      - name: Generate Android project (non-interactive)
        run: node Scripts/Generate-Twa.js
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build signed AAB
        working-directory: twa
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            "-Pandroid.injected.signing.store.file=$(pwd)/android.keystore" \
            "-Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }}" \
            "-Pandroid.injected.signing.key.alias=android" \
            "-Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: workcalc-v${{ github.event.inputs.version_name }}-code${{ github.event.inputs.version_code }}
          path: twa/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
